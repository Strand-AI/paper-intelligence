name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests (skip slow integration tests)
        run: uv run pytest tests/ -v --tb=short --ignore=tests/test_integration.py

      - name: Smoke-test wheel with clean dependency resolution
        run: |
          uv build --wheel --out-dir dist-smoke
          WHEEL=$(find dist-smoke -name '*.whl' -print -quit)
          timeout 30s uvx --refresh --from "$WHEEL" paper-intelligence </dev/null

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check import sorting with isort
        run: uv run python -m isort --check-only --diff paper_intelligence tests
        continue-on-error: true

      - name: Check formatting with black
        run: uv run python -m black --check paper_intelligence tests
        continue-on-error: true
